<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/uploads/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>SAM Messenger</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0e1621; color: #efeef1; margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #main-app { width: 100vw; height: 100vh; position: relative; }
        .app-layout { display: flex; height: 100%; width: 100%; position: relative; }
        
        /* Боковое меню (Личный кабинет) */
        #side-menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; transition: opacity 0.25s ease; }
        #side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background-color: #1c242f; z-index: 1001; transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 2px 0 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        #side-menu.open { left: 0; }
        .menu-profile-header { padding: 25px 20px; background-color: #242f3d; border-bottom: 1px solid #10171e; }
        .menu-avatar { width: 55px; height: 55px; border-radius: 50%; background: #2a94e6; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .menu-name { font-weight: 600; color: #fff; font-size: 16px; }
        .menu-status { font-size: 13px; color: #5288c1; margin-top: 4px;}
        .menu-items { padding: 10px 0; }
        .menu-item { padding: 15px 20px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: #e1e6eb; font-weight: 500; transition: background 0.2s ease, padding-left 0.2s ease;}
        .menu-item:hover { background-color: #242f3d; padding-left: 25px; }
        .menu-icon { font-size: 18px; width: 24px; text-align: center; }

        /* Панель списка чатов (Сайдбар) */
        .sidebar { width: 320px; background-color: #17212b; border-right: 1px solid #10171e; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-header { padding: 12px 15px; display: flex; align-items: center; gap: 15px; background: #17212b; }
        .hamburger { font-size: 24px; color: #7f91a4; cursor: pointer; user-select: none; padding: 0 4px; transition: color 0.2s; }
        .hamburger:hover { color: #fff; }
        .search-bar { flex-grow: 1; background: #24303f; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; font-size: 14px; transition: background 0.2s; }
        .search-bar:focus { background: #2b394a; }
        .room-list { flex-grow: 1; overflow-y: auto; }
        .room-item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; gap: 12px; border-bottom: 1px solid rgba(16, 23, 30, 0.3); transition: background-color 0.2s ease; }
        .room-item:hover { background-color: #202b36; }
        .room-item.active { background-color: #2b394a; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2f6ea5; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; text-transform: uppercase; flex-shrink: 0; transition: transform 0.2s ease; }
        .room-item:hover .avatar { transform: scale(1.04); }
        .room-info { flex-grow: 1; min-width: 0; }
        .room-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .room-name { font-weight: 600; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-time { color: #7f91a4; font-size: 12px; }
        .room-preview { color: #7f91a4; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Главная область чата */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #0e1621; background-image: url('https://user-images.githubusercontent.com/15082143/114170940-bf38b580-9943-11eb-8c9e-5b169527ec68.jpg'); background-attachment: fixed; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .chat-header { padding: 12px 15px; background-color: #17212b; border-bottom: 1px solid #10171e; display: flex; align-items: center; gap: 10px; height: 60px; }
        
        /* Кнопка назад для мобилок */
        .back-btn { display: none; font-size: 22px; color: #5288c1; cursor: pointer; padding: 0 8px 0 4px; user-select: none; }
        .chat-title { font-weight: 600; color: #fff; font-size: 16px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .messages-container { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        
        /* Сообщения */
        .msg-row { display: flex; width: 100%; animation: fadeInMsg 0.2s ease-out forwards; }
        @keyframes fadeInMsg { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-row.my-row { justify-content: flex-end; }
        .msg-block { background-color: #182533; padding: 6px 12px; border-radius: 10px 10px 10px 0px; max-width: 75%; position: relative; color: #f5f5f5; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
        .msg-row.my-row .msg-block { background-color: #2b5278; border-radius: 10px 10px 0px 10px; }
        .msg-block.system-msg { background-color: #131c26 !important; border: 1px dashed #ff7b72; color: #8b949e; font-style: italic; }
        .msg-author { font-size: 13px; color: #5288c1; font-weight: 600; margin-bottom: 3px; }
        .msg-row.my-row .msg-author { display: none; }
        .msg-body { font-size: 14.5px; line-height: 1.4; word-break: break-word; padding-right: 35px; }
        .msg-body img { max-width: 100%; max-height: 250px; border-radius: 5px; margin-top: 4px; display: block; }
        
        /* Плееры */
        .msg-body audio { width: 100%; max-width: 250px; margin-top: 6px; display: block; }
        .msg-body video { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 6px; display: block; background: #000; }
        
        .download-btn {
            display: inline-flex; align-items: center; gap: 5px;
            margin-top: 8px; padding: 6px 12px; background: #24303f;
            color: #fff !important; text-decoration: none; font-size: 12px;
            border-radius: 4px; border: 1px solid #2b394a; font-weight: 500; width: fit-content;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #2b394a; }
        .msg-row.my-row .download-btn { background: #1c354e; border-color: #234363; }
        .msg-row.my-row .download-btn:hover { background: #234363; }
        .msg-time { position: absolute; right: 8px; bottom: 4px; font-size: 10px; color: #7f91a4; }
        
        .admin-actions { display: none; margin-top: 5px; font-size: 11px; gap: 10px; border-top: 1px solid #24303f; padding-top: 4px; }
        .admin-active .admin-actions { display: flex; }
        .adm-btn { color: #ff6b6b; cursor: pointer; }

        /* Нижняя панель ввода */
        .input-panel { padding: 10px 15px; display: flex; gap: 12px; background-color: #17212b; align-items: center; }
        .attach-btn { color: #7f91a4; font-size: 22px; cursor: pointer; user-select: none; transition: color 0.2s; }
        .attach-btn:hover { color: #fff; }
        #file-input { display: none; }
        #message-input { flex-grow: 1; padding: 10px 12px; background-color: #0e1621; border: none; border-radius: 20px; color: white; outline: none; font-size: 15px; }
        #send-btn { color: #5288c1; font-size: 15px; font-weight: bold; cursor: pointer; user-select: none; padding: 5px; transition: color 0.2s, transform 0.1s; }
        #send-btn:hover { color: #649cd4; transform: scale(1.05); }
        
        /* Модалки и анимация выезда */
        .modal-overlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; 
            align-items: center; padding: 20px; opacity: 0; transition: opacity 0.2s ease;
        }
        .modal-box { 
            background: #17212b; padding: 20px; border-radius: 8px; width: 100%; 
            max-width: 340px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
            transform: scale(0.85); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.show { opacity: 1; }
        .modal-overlay.show .modal-box { transform: scale(1); }

        .modal-box h3 { margin-top: 0; color: #fff; }
        .modal-list { max-height: 250px; overflow-y: auto; margin-bottom: 15px; }
        .modal-list-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #24303f; color: #e1e6eb; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
        .modal-list-item:hover { background: #202b36; }
        .modal-input { width: 100%; padding: 10px; background: #0e1621; border: 1px solid #24303f; color: white; border-radius: 5px; margin-bottom: 15px; outline: none; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
        
        .btn-cancel { background: transparent; color: #7f91a4; border: none; cursor: pointer; padding: 8px 12px; font-weight: 500; }
        .btn-primary { background: #2481cc; color: white; border: none; cursor: pointer; padding: 8px 15px; border-radius: 4px; font-weight: 500; transition: background 0.2s; }
        .btn-primary:hover { background: #2f93e0; }
        .btn-danger { background: #e53935; color: white; border: none; cursor: pointer; padding: 8px 15px; border-radius: 4px; font-weight: 500; transition: background 0.2s; }
        .btn-danger:hover { background: #ef5350; }
        .btn-success { background: #43a047; color: white; border: none; cursor: pointer; padding: 8px 15px; border-radius: 4px; font-weight: 500; transition: background 0.2s; }
        .btn-success:hover { background: #4caf50; }

        #empty-chat-msg { text-align: center; color: #7f91a4; background: rgba(23, 33, 43, 0.7); padding: 10px 20px; border-radius: 20px; margin: auto; font-size: 14px; max-width: 80%; }

        /* Кнопка звонка в шапке */
        .header-action-btn { background: transparent; border: none; color: #5288c1; font-size: 18px; cursor: pointer; padding: 6px 10px; border-radius: 5px; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; }
        .header-action-btn:hover { background: #24303f; color: #fff; }

        /* Пульсирующий вызов трубки */
        .pulse-btn { animation: phonePulse 1.2s infinite alternate; }
        @keyframes phonePulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Скрытые аудио теги для WebRTC */
        #localAudio, #remoteAudio { display: none; }

        /* ================= MOBILE RESPONSIVE LOGIC (TELEGRAM STYLE) ================= */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                left: 0; top: 0; height: 100%;
                z-index: 5;
                transform: translateX(0);
            }
            .chat-area {
                width: 100%;
                position: absolute;
                left: 0; top: 0; height: 100%;
                z-index: 10;
                transform: translateX(100%);
            }
            
            .app-layout.chat-open .sidebar {
                transform: translateX(-30%);
            }
            .app-layout.chat-open .chat-area {
                transform: translateX(0);
            }
            
            .back-btn { display: block; }
            .messages-container { padding: 12px; }
            .msg-block { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="main-app">
        <div id="side-menu-overlay" onclick="toggleMenu()"></div>
        <div id="side-menu">
            <div class="menu-profile-header">
                <div class="menu-avatar" id="menu-avatar-letter">U</div>
                <div class="menu-name" id="menu-username">Username</div>
                <div class="menu-status">SAM Личный кабинет</div>
            </div>
            <div class="menu-items">
                <div class="menu-item" onclick="window.location.href='/apps'"><span class="menu-icon">📥</span> Скачать приложение</div>
                <div class="menu-item" onclick="window.location.href='/profile'"><span class="menu-icon">✏️</span> Изменить ник</div>
                <div class="menu-item" onclick="openCreateGroupModal()"><span class="menu-icon">👥</span> Создать группу</div>
                <div class="menu-item" onclick="openContactsModal()"><span class="menu-icon">👤</span> Контакты</div>
                <div class="menu-item" onclick="localStorage.clear(); window.location.href='/'"><span class="menu-icon">🚪</span> Выйти</div>
            </div>
        </div>

        <!-- МОДАЛКИ -->
        <div id="group-modal" class="modal-overlay">
            <div class="modal-box">
                <h3>Создать группу</h3>
                <input type="text" id="new-group-name" class="modal-input" placeholder="Название группы...">
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeModals()">Отмена</button>
                    <button class="btn-primary" onclick="confirmCreateGroup()">Создать</button>
                </div>
            </div>
        </div>

        <div id="contacts-modal" class="modal-overlay">
            <div class="modal-box">
                <h3>Выберите контакт</h3>
                <div id="contacts-list" class="modal-list"></div>
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeModals()">Закрыть</button>
                </div>
            </div>
        </div>

        <div id="add-member-modal" class="modal-overlay">
            <div class="modal-box">
                <h3>Добавить в группу</h3>
                <div id="add-member-list" class="modal-list"></div>
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeModals()">Закрыть</button>
                </div>
            </div>
        </div>

        <!-- ВХОДЯЩИЙ ЗВУКОВОЙ ВЫЗОВ -->
        <div id="incoming-call-modal" class="modal-overlay">
            <div class="modal-box" style="text-align: center;">
                <h3 style="margin-bottom: 5px;">Входящий вызов</h3>
                <div id="caller-name" style="color: #7f91a4; font-size: 15px; margin-bottom: 20px;">Пользователь</div>
                <div class="modal-btns" style="justify-content: center; gap: 20px;">
                    <button class="btn-danger" onclick="declineCall()">Отклонить</button>
                    <button class="btn-success pulse-btn" onclick="acceptCall()">Принять</button>
                </div>
            </div>
        </div>

        <!-- ОФОРМЛЕНИЕ ТЕКУЩЕГО РАЗГОВОРА -->
        <div id="call-status-modal" class="modal-overlay">
            <div class="modal-box" style="text-align: center;">
                <h3 id="call-status-text">Установка связи...</h3>
                <div id="call-timer" style="color: #5288c1; font-weight: bold; margin: 15px 0; font-size: 18px;">00:00</div>
                <div class="modal-btns" style="justify-content: center;">
                    <button class="btn-danger" onclick="hangUp()">Положить трубку</button>
                </div>
            </div>
        </div>

        <!-- Теги потоков WebRTC -->
        <audio id="localAudio" autoplay muted></audio>
        <audio id="remoteAudio" autoplay></audio>

        <div class="app-layout" id="layout-wrapper">
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="hamburger" onclick="toggleMenu()">☰</div>
                    <input type="text" class="search-bar" placeholder="Поиск">
                </div>
                <div class="room-list" id="sidebar-room-list"></div>
            </div>
            
            <div class="chat-area">
                <div class="chat-header" id="main-chat-header" style="display: none;">
                    <div class="back-btn" onclick="backToRoomList()">⬅</div>
                    <div class="chat-title" id="chat-title-top">Название чата</div>
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <button id="call-user-btn" class="header-action-btn" onclick="startCallWithActiveUser()" title="Позвонить">📞</button>
                        <button id="add-member-btn" style="display: none; background: #2481cc; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500;">+ Участник</button>
                    </div>
                </div>
                <div class="messages-container" id="messages">
                    <div id="empty-chat-msg">Выберите чат или создайте новый для начала общения</div>
                </div>
                <div class="input-panel" id="main-input-panel" style="display: none;">
                    <label class="attach-btn">
                        📎<input type="file" id="file-input" onchange="sendFile()">
                    </label>
                    <input type="text" id="message-input" maxlength="1000" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                    <div id="send-btn" onclick="sendTextMessage()">ОТПРАВИТЬ</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const u = localStorage.getItem('sam_username');
        const p = localStorage.getItem('sam_password');
        if(!u || !p) window.location.href = '/';

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(wsProtocol + '//' + window.location.host + '/ws');
        
        let myUsername = u;
        let myRole = 'user';
        let currentRoom = null;
        let currentChatPartner = null; // Храним чистый ник собеседника для ЛС
        let renderedRooms = new Set();

        // Переменные WebRTC
        let localStream = null;
        let peerConnection = null;
        let callTarget = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        ws.onopen = function() {
            ws.send(JSON.stringify({ action: 'login', username: u, password: p }));
        };

        ws.onmessage = async function(event) {
            const data = JSON.parse(event.data);

            if (data.type === 'auth_result') {
                if (data.success) {
                    myUsername = data.username;
                    myRole = data.role;
                    document.getElementById('menu-username').textContent = myUsername;
                    document.getElementById('menu-avatar-letter').textContent = myUsername.charAt(0).toUpperCase();
                    if (myRole === 'admin') document.getElementById('messages').classList.add('admin-active');
                } else {
                    window.location.href = '/';
                }
            }
            else if (data.type === 'init_data') {
                data.groups.forEach(g => addRoomToSidebar(g, false));
                data.private_rooms.forEach(pr => {
                    const parts = pr.split('|');
                    const targetUser = parts[1] === myUsername ? parts[2] : parts[1];
                    addRoomToSidebar(pr, true, targetUser);
                });
            }
            else if (data.type === 'new_group') {
                addRoomToSidebar(data.name, false);
            }
            else if (data.type === 'user_list') {
                const targetId = (document.getElementById('add-member-modal').style.display === 'flex') ? 'add-member-list' : 'contacts-list';
                const listEl = document.getElementById(targetId);
                listEl.innerHTML = '';
                data.users.forEach(user => {
                    if (user === myUsername) return; // Себе звонить не будем
                    const div = document.createElement('div');
                    div.className = 'modal-list-item';
                    div.innerHTML = `<div class="avatar" style="width:30px;height:30px;font-size:14px;">${user.charAt(0).toUpperCase()}</div> ${user}`;
                    div.onclick = () => { 
                        closeModals(); 
                        if (targetId === 'add-member-list') {
                            ws.send(JSON.stringify({ action: 'add_to_group', room: currentRoom, username: user }));
                        } else {
                            startPrivateChat(user); 
                        }
                    };
                    listEl.appendChild(div);
                });
            }
            else if (data.type === 'msg') {
                let isPrivate = data.room.startsWith('PRIVATE|');
                let targetTitle = data.room;
                if(isPrivate) {
                    const parts = data.room.split('|');
                    targetTitle = parts[1] === myUsername ? parts[2] : parts[1];
                }
                addRoomToSidebar(data.room, isPrivate, targetTitle);

                const previewEl = document.getElementById('p-' + data.room);
                const timeEl = document.getElementById('t-' + data.room);
                if (previewEl) {
                    if (data.msg_type === 'text') {
                        previewEl.textContent = `${data.username}: ${data.content}`;
                    } else if (data.msg_type === 'image') {
                        previewEl.textContent = `${data.username}: [Фотография]`;
                    } else if (data.msg_type === 'audio') {
                        previewEl.textContent = `${data.username}: [Аудиозапись]`;
                    } else if (data.msg_type === 'video') {
                        previewEl.textContent = `${data.username}: [Видеозапись]`;
                    } else {
                        previewEl.textContent = `${data.username}: [Файл]`;
                    }
                    if(timeEl) timeEl.textContent = data.time;
                }

                if (data.room === currentRoom) {
                    renderMessage(data, data.history);
                }
            }
            else if (data.type === 'clear_chat') {
                document.getElementById('messages').innerHTML = '';
            }
            else if (data.type === 'delete_evt') {
                const el = document.getElementById('content-' + data.id);
                const block = document.getElementById('block-' + data.id);
                if (el && block) {
                    el.innerHTML = "Сообщение удалено администратором";
                    block.classList.add('system-msg');
                }
            }
            else if (data.type === 'error_msg') {
                alert(data.text);
            }
            else if (data.type === 'success_msg') {
                alert(data.text);
            }

            /* --- СИГНАЛЫ ВЕБ-ЗВОНКОВ ДЛЯ СЕРВЕРА --- */
            else if (data.type === 'incoming_call') {
                callTarget = data.from;
                document.getElementById('caller-name').textContent = data.from;
                openModal('incoming-call-modal');
            }
            else if (data.type === 'call_response') {
                if (data.accepted) {
                    document.getElementById('call-status-text').textContent = "Разговор";
                    startTimer();
                    await startWebRTCPeer(true);
                } else {
                    alert("Вызов отклонен пользователем.");
                    closeModals();
                }
            }
            else if (data.type === 'webrtc_signal') {
                if (!peerConnection) await startWebRTCPeer(false);
                
                if (data.signal.sdp) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                    if (data.signal.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        ws.send(JSON.stringify({
                            action: 'webrtc_signal',
                            target: callTarget,
                            signal: { sdp: peerConnection.localDescription }
                        }));
                    }
                } else if (data.signal.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                    } catch (e) { console.error("Ошибка кандидатов ICE", e); }
                }
            }
        };

        // Логика переключения меню и плавного появления окон
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('side-menu-overlay');
            const isOpen = menu.classList.contains('open');
            
            if(!isOpen) {
                overlay.style.display = 'block';
                setTimeout(() => overlay.style.opacity = '1', 10);
                menu.classList.add('open');
            } else {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 250);
                menu.classList.remove('open');
            }
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.classList.remove('show');
                setTimeout(() => modal.style.display = 'none', 200);
            });
        }

        function openCreateGroupModal() { toggleMenu(); openModal('group-modal'); }
        
        function confirmCreateGroup() {
            const val = document.getElementById('new-group-name').value.trim();
            if(val) {
                ws.send(JSON.stringify({ action: 'create_group', name: val }));
                document.getElementById('new-group-name').value = '';
                closeModals();
            }
        }

        function openContactsModal() {
            toggleMenu();
            ws.send(JSON.stringify({ action: 'get_users' }));
            openModal('contacts-modal');
        }

        function openAddMemberModal() {
            ws.send(JSON.stringify({ action: 'get_users' }));
            openModal('add-member-modal');
        }

        function startPrivateChat(targetUser) {
            const users = [myUsername, targetUser].sort();
            const roomId = `PRIVATE|${users[0]}|${users[1]}`;
            addRoomToSidebar(roomId, true, targetUser);
            changeRoom(roomId, targetUser);
        }

        function addRoomToSidebar(roomId, isPrivate, customTitle = null) {
            if(renderedRooms.has(roomId)) return;
            renderedRooms.add(roomId);

            const title = customTitle || roomId;
            const bgStr = isPrivate ? 'background:#b84343' : '';
            const div = document.createElement('div');
            div.className = 'room-item';
            div.id = 'room-' + roomId;
            div.onclick = () => changeRoom(roomId, title);

            div.innerHTML = `
                <div class="avatar" style="${bgStr}">${title.charAt(0).toUpperCase()}</div>
                <div class="room-info">
                    <div class="room-meta"><span class="room-name">${title}</span><span class="room-time" id="t-${roomId}"></span></div>
                    <div class="room-preview" id="p-${roomId}">Нет сообщений</div>
                </div>
            `;
            document.getElementById('sidebar-room-list').prepend(div);
        }

        function changeRoom(roomId, titleText) {
            if (currentRoom === roomId) {
                document.getElementById('layout-wrapper').classList.add('chat-open');
                return;
            }
            if (currentRoom) {
                const oldEl = document.getElementById('room-' + currentRoom);
                if(oldEl) oldEl.classList.remove('active');
            }
            currentRoom = roomId;
            document.getElementById('room-' + currentRoom).classList.add('active');
            
            document.getElementById('main-chat-header').style.display = 'flex';
            document.getElementById('main-input-panel').style.display = 'flex';
            document.getElementById('chat-title-top').textContent = titleText;
            
            if (!roomId.startsWith('PRIVATE|')) {
                document.getElementById('add-member-btn').style.display = 'block';
                document.getElementById('call-user-btn').style.display = 'none'; // Скрываем в группах, если бэк рассчитан на p2p
                currentChatPartner = null;
            } else {
                document.getElementById('add-member-btn').style.display = 'none';
                document.getElementById('call-user-btn').style.display = 'block';
                currentChatPartner = titleText; // Запоминаем чистый ник оппонента
            }
            
            document.getElementById('layout-wrapper').classList.add('chat-open');
            ws.send(JSON.stringify({ action: 'join_room', room: roomId }));
        }

        function backToRoomList() {
            document.getElementById('layout-wrapper').classList.remove('chat-open');
        }

        function sendTextMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text && currentRoom) {
                ws.send(JSON.stringify({ action: 'send_msg', room: currentRoom, content: text, msg_type: 'text' }));
                input.value = '';
            }
        }

        function sendFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file || !currentRoom) return;

            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const contentPayload = { name: data.name, url: data.url };
                    ws.send(JSON.stringify({ 
                        action: 'send_msg', 
                        room: currentRoom, 
                        content: JSON.stringify(contentPayload), 
                        msg_type: data.msg_type 
                    }));
                } else {
                    alert("Ошибка загрузки файла: " + data.error);
                }
            })
            .catch(err => {
                console.error(err);
                alert("Не удалось загрузить файл на сервер.");
            });
            fileInput.value = '';
        }

        function renderMessage(msg, isHistoryLoad) {
            const container = document.getElementById('messages');
            const emptyMsg = document.getElementById('empty-chat-msg');
            if(emptyMsg) emptyMsg.remove();

            const isMe = msg.username === myUsername;
            const row = document.createElement('div');
            row.className = 'msg-row' + (isMe ? ' my-row' : '');
            
            const div = document.createElement('div');
            div.id = 'block-' + msg.id;
            div.className = 'msg-block' + (msg.msg_type === 'system' ? ' system-msg' : '');
            
            let html = `<div class="msg-author">${msg.username}</div><div class="msg-body" id="content-${msg.id}">`;
            
            if (msg.msg_type === 'text') {
                html += document.createTextNode(msg.content).textContent;
            } else if (['image', 'file', 'audio', 'video'].includes(msg.msg_type)) {
                try {
                    const fileData = JSON.parse(msg.content);
                    if (msg.msg_type === 'image') {
                        html += `<img src="${fileData.url}" alt="${fileData.name}">`;
                    } else if (msg.msg_type === 'audio') {
                        html += `🎵 <b>${fileData.name}</b><audio controls src="${fileData.url}"></audio>`;
                    } else if (msg.msg_type === 'video') {
                        html += `🎥 <b>${fileData.name}</b><video controls src="${fileData.url}"></video>`;
                    } else {
                        html += `📎 <b>${fileData.name}</b>`;
                    }
                    html += `<br><a href="${fileData.url}" download="${fileData.name}" class="download-btn">📥 Скачать</a>`;
                } catch(e) {
                    if (msg.msg_type === 'image') html += `<img src="${msg.content}">`;
                    else html += `📎 Старый файл (Base64)`;
                }
            } else if (msg.msg_type === 'system') {
                html += msg.content;
            }
            
            html += `</div><div class="msg-time">${msg.time}</div>`;
            if (msg.msg_type !== 'system') {
                html += `<div class="admin-actions"><span class="adm-btn" onclick="deleteMessage(${msg.id})">Удалить</span></div>`;
            }
            
            div.innerHTML = html; row.appendChild(div); container.appendChild(row);
            if(!isHistoryLoad) container.scrollTop = container.scrollHeight;
            else setTimeout(() => { container.scrollTop = container.scrollHeight; }, 10);
        }

        function deleteMessage(id) { if(confirm("Удалить?")) ws.send(JSON.stringify({ action: 'delete_msg', msg_id: id })); }

        // --- WEBRTC КЛИЕНТСКАЯ ЛОГИКА ---
        function startCallWithActiveUser() {
            if (!currentChatPartner) return;
            callTarget = currentChatPartner;
            
            document.getElementById('call-status-text').textContent = `Вызов ${callTarget}...`;
            resetTimer();
            openModal('call-status-modal');

            ws.send(JSON.stringify({
                action: 'call_user',
                target: callTarget
            }));
        }

        async function acceptCall() {
            closeModals();
            document.getElementById('call-status-text').textContent = "Подключение...";
            openModal('call-status-modal');
            startTimer();

            ws.send(JSON.stringify({
                action: 'call_response',
                target: callTarget,
                accepted: true
            }));
        }

        function declineCall() {
            closeModals();
            ws.send(JSON.stringify({
                action: 'call_response',
                target: callTarget,
                accepted: false
            }));
            callTarget = null;
        }

        async function startWebRTCPeer(isCaller) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                document.getElementById('localAudio').srcObject = localStream;
            } catch (err) {
                alert("Ошибка доступа к микрофону: " + err);
                hangUp();
                return;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        action: 'webrtc_signal',
                        target: callTarget,
                        signal: { candidate: event.candidate }
                    }));
                }
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                ws.send(JSON.stringify({
                    action: 'webrtc_signal',
                    target: callTarget,
                    signal: { sdp: peerConnection.localDescription }
                }));
            }
        }

        function hangUp() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            stopTimer();
            closeModals();
            callTarget = null;
        }

        // Таймер разговора
        function startTimer() {
            resetTimer();
            callTimerInterval = setInterval(() => {
                callSeconds++;
                let m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
                let s = (callSeconds % 60).toString().padStart(2, '0');
                document.getElementById('call-timer').textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(callTimerInterval); }
        function resetTimer() { callSeconds = 0; document.getElementById('call-timer').textContent = "00:00"; }
    </script>
</body>
</html>
