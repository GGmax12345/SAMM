<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/uploads/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no, viewport-fit=cover">
    <title>SAM Messenger</title>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background: radial-gradient(circle at center, #0c1526 0%, #020408 100%);
            color: #dbe5ff; margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Интерактивный интерактивный фонарик за курсором */
        #cursor-glow-bg {
            position: fixed; width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(0, 160, 255, 0.16) 0%, transparent 65%);
            filter: blur(15px); border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%); z-index: 0; top: 0; left: 0;
        }
        
        #main-app { width: 100vw; height: 100vh; position: relative; z-index: 1; }
        .app-layout { display: flex; height: 100%; width: 100%; position: relative; }
        
        /* Боковое меню (Личный кабинет) */
        #side-menu-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 1000; opacity: 0; 
            transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            backdrop-filter: blur(4px);
        }
        #side-menu { 
            position: fixed; top: 0; left: -300px; width: 290px; height: 100%; 
            background: rgba(10, 16, 26, 0.75); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid rgba(163, 191, 255, 0.08);
            z-index: 1001; 
            transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 5px 0 25px rgba(0,0,0,0.6); display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        #side-menu.open { left: 0; }
        .menu-profile-header { padding: 30px 20px; background: rgba(0, 140, 255, 0.08); border-bottom: 1px solid rgba(163, 191, 255, 0.08); }
        .menu-avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #00a0ff 0%, #0060d0 100%); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 12px; box-shadow: 0 0 20px rgba(0, 160, 255, 0.4); background-size: cover; background-position: center; }
        .menu-name { font-weight: 600; color: #fff; font-size: 17px; text-shadow: 0 0 8px rgba(163, 191, 255, 0.25); }
        .menu-status { font-size: 13px; color: #6e89b5; margin-top: 4px; font-weight: 500;}
        .menu-items { padding: 10px 0; flex-grow: 1; overflow-y: auto; }
        .menu-item { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: #dbe5ff; font-weight: 500; transition: background 0.2s ease; }
        .menu-item:hover { background: rgba(0, 150, 255, 0.1); }
        .menu-item:active { background: rgba(0, 150, 255, 0.18); }
        .menu-icon { font-size: 20px; width: 24px; text-align: center; }

        /* Сайдбар списка чатов */
        .sidebar { width: 340px; background: rgba(10, 16, 26, 0.55); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-right: 1px solid rgba(163, 191, 255, 0.06); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-header { 
            padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: rgba(10, 16, 26, 0.4); 
            padding-top: calc(14px + env(safe-area-inset-top));
            border-bottom: 1px solid rgba(163, 191, 255, 0.06);
        }
        .hamburger { font-size: 22px; color: #6e89b5; cursor: pointer; user-select: none; padding: 6px; transition: color 0.2s; }
        .hamburger:hover { color: #b0ccff; filter: drop-shadow(0 0 6px rgba(176, 204, 255, 0.5)); }
        .search-bar { flex-grow: 1; background: rgba(12, 18, 30, 0.5); border: 1px solid rgba(163, 191, 255, 0.06); border-radius: 22px; padding: 10px 16px; color: #dbe5ff; outline: none; font-size: 15px; transition: background 0.2s, border 0.2s; }
        .search-bar::placeholder { color: #435368; }
        .search-bar:focus { background: rgba(8, 12, 22, 0.7); border-color: rgba(0, 180, 255, 0.35); box-shadow: 0 0 14px rgba(0, 160, 255, 0.15); }
        
        .room-list { flex-grow: 1; overflow-y: auto; scrollbar-width: none; }
        .room-list::-webkit-scrollbar { display: none; }
        
        .room-item { display: flex; align-items: center; padding: 14px 16px; cursor: pointer; gap: 14px; border-bottom: 1px solid rgba(163, 191, 255, 0.05); transition: background-color 0.2s ease; }
        .room-item:hover { background: rgba(0, 150, 255, 0.06); }
        .room-item:active { background: rgba(0, 150, 255, 0.12); }
        .room-item.active { background: rgba(0, 150, 255, 0.14); box-shadow: inset 3px 0 0 rgba(0, 180, 255, 0.6); }
        
        .avatar-wrapper { position: relative; display: inline-block; flex-shrink: 0; }
        .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #1c7fd6 0%, #0a4f96 100%); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; text-transform: uppercase; flex-shrink: 0; transition: transform 0.2s ease; box-shadow: 0 0 12px rgba(0, 140, 255, 0.25); background-size: cover; background-position: center; }
        
        .online-dot { 
            position: absolute; bottom: 1px; right: 1px; width: 13px; height: 13px; 
            background-color: #4caf50; border: 2.5px solid #0c1526; border-radius: 50%; 
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.7);
            display: none; z-index: 5;
        }
        .room-item.online .online-dot { display: block; }

        .room-info { flex-grow: 1; min-width: 0; }
        .room-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .room-name { font-weight: 600; color: #fff; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-time { color: #6e89b5; font-size: 12px; font-weight: 500; }
        .room-preview { color: #6e89b5; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Главная область чата */
        .chat-area { 
            flex-grow: 1; display: flex; flex-direction: column; 
            background: radial-gradient(circle at 50% 0%, #10203a 0%, #05070d 100%); 
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .chat-header { 
            padding: 10px 16px; background: rgba(10, 16, 26, 0.6); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(163, 191, 255, 0.06); display: flex; align-items: center; gap: 12px; 
            min-height: 60px; padding-top: calc(10px + env(safe-area-inset-top));
            z-index: 10;
        }
        
        .back-btn { display: none; font-size: 20px; color: #6e89b5; cursor: pointer; padding: 8px 12px 8px 4px; user-select: none; font-weight: bold; }
        .chat-title { font-weight: 700; font-size: 16.5px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: linear-gradient(135deg, #ffffff 0%, #a3cfff 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .messages-container { flex-grow: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; scrollbar-width: none; }
        .messages-container::-webkit-scrollbar { display: none; }
        
        /* Отображение сообщений */
        .msg-row { display: flex; width: 100%; animation: fadeInMsg 0.22s ease-out forwards; }
        @keyframes fadeInMsg { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-row.my-row { justify-content: flex-end; }
        .msg-block { 
            background: rgba(16, 24, 38, 0.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(163, 191, 255, 0.07);
            padding: 8px 14px 6px 14px; border-radius: 16px 16px 16px 4px; 
            max-width: 75%; position: relative; color: #f5f5f5; display: flex; flex-direction: column; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.35); 
        }
        .msg-row.my-row .msg-block { background: rgba(0, 110, 220, 0.28); border: 1px solid rgba(0, 180, 255, 0.2); border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 14px rgba(0, 110, 220, 0.2); }
        .msg-block.system-msg { background: rgba(19, 28, 38, 0.85) !important; border: 1px dashed #ff7b72; color: #8b949e; font-style: italic; align-self: center; border-radius: 10px; }
        .msg-author { font-size: 13px; color: #5ab0ff; font-weight: 600; margin-bottom: 4px; text-shadow: 0 0 8px rgba(0, 160, 255, 0.3); }
        .msg-row.my-row .msg-author { display: none; }
        .msg-body { font-size: 15px; line-height: 1.45; word-break: break-word; padding-right: 40px; padding-bottom: 4px; }
        .msg-body img { max-width: 100%; max-height: 280px; border-radius: 10px; margin-top: 6px; display: block; }
        
        .msg-body audio { width: 100%; max-width: 260px; margin-top: 6px; display: block; }
        .msg-body video { max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 6px; display: block; background: #000; }
        
        .download-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 8px; padding: 8px 14px; background: rgba(0, 140, 255, 0.1);
            color: #fff !important; text-decoration: none; font-size: 12.5px;
            border-radius: 8px; border: 1px solid rgba(0, 180, 255, 0.2); font-weight: 500; width: fit-content;
            transition: background 0.2s;
        }
        .download-btn:hover { background: rgba(0, 140, 255, 0.2); }
        .msg-row.my-row .download-btn { background: rgba(0, 180, 255, 0.15); border-color: rgba(0, 180, 255, 0.3); }
        
        .msg-time { position: absolute; right: 10px; bottom: 5px; font-size: 10.5px; color: #6e89b5; font-weight: 500; }
        
        .admin-actions { display: none; margin-top: 6px; font-size: 11.5px; gap: 12px; border-top: 1px solid rgba(163, 191, 255, 0.08); padding-top: 6px; }
        .admin-active .admin-actions { display: flex; }
        .adm-btn { color: #ff6b6b; cursor: pointer; font-weight: 500; }

        /* Нижняя панель ввода */
        .input-panel { 
            padding: 10px 16px; display: flex; gap: 12px; 
            background: rgba(10, 16, 26, 0.8); align-items: center;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(163, 191, 255, 0.06);
            z-index: 10;
        }
        .attach-btn { color: #6e89b5; font-size: 24px; cursor: pointer; user-select: none; padding: 4px; transition: color 0.2s; }
        .attach-btn:hover { color: #fff; }
        #file-input { display: none; }
        
        #message-input { flex-grow: 1; padding: 11px 16px; background: rgba(5, 8, 15, 0.6); border: 1px solid rgba(163, 191, 255, 0.06); border-radius: 24px; color: white; outline: none; font-size: 15px; transition: border 0.2s; }
        #message-input:focus { border-color: rgba(0, 160, 255, 0.4); background: rgba(5, 8, 15, 0.8); }
        #send-btn { color: #00a0ff; font-size: 15px; font-weight: 600; cursor: pointer; user-select: none; padding: 6px 12px; transition: color 0.2s, text-shadow 0.2s; }
        #send-btn:hover { color: #5ab0ff; text-shadow: 0 0 8px rgba(0, 160, 255, 0.5); }

        /* Шапка кнопок действий звонков / управления комнатой */
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .header-action-btn { 
            font-size: 20px; color: #6e89b5; cursor: pointer; user-select: none; 
            border-radius: 50%; transition: background 0.2s, color 0.2s;
            display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
        }
        .header-action-btn:hover { background: rgba(0, 150, 255, 0.12); color: #fff; }
        
        .pulse-btn { animation: phonePulse 1.2s infinite alternate; box-shadow: 0 0 15px rgba(67, 160, 71, 0.4); }
        @keyframes phonePulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        
        #localAudio, #remoteAudio { display: none; }

        /* Модальные окна */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: #0e1624; border: 1px solid rgba(163, 191, 255, 0.08); padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #fff; }
        .modal-box h3 { margin-top: 0; margin-bottom: 16px; font-size: 18px; font-weight: 600; }
        .modal-box input[type="text"] { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(163, 191, 255, 0.1); border-radius: 10px; color: #fff; outline: none; margin-bottom: 16px; font-size: 15px; }
        .modal-box input[type="text"]:focus { border-color: #00a0ff; }
        
        .modal-btns { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .modal-btns button { padding: 10px 18px; border: none; border-radius: 10px; font-size: 14.5px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-cancel { background: #202b36; color: #6e89b5; }
        .btn-cancel:hover { background: #2b394a; color: #fff; }
        .btn-confirm { background: #00a0ff; color: #fff; }
        .btn-confirm:hover { background: #008cd0; }
        .btn-danger { background: #d32f2f; color: #fff; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-success { background: #388e3c; color: #fff; }
        .btn-success:hover { background: #2e7d32; }

        .modal-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding-right: 4px; }
        .modal-list-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(163, 191, 255, 0.03); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .modal-list-item:hover { background: rgba(0, 160, 255, 0.1); }
        .modal-list-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }

        /* Модальное окно галереи */
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 350px; overflow-y: auto; padding-top: 10px; }

        /* ================= МОБИЛЬНАЯ АДАПТИВНОСТЬ (TELEGRAM STYLE) ================= */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; left: 0; top: 0; height: 100%; z-index: 5; transform: translateX(0); }
            .chat-area { width: 100%; position: absolute; left: 0; top: 0; height: 100%; z-index: 4; transform: translateX(100%); }
            .back-btn { display: block; }
            
            /* Переключение экранов на мобилках через обертку раскладки */
            .app-layout.chat-open .sidebar { transform: translateX(-100%); }
            .app-layout.chat-open .chat-area { transform: translateX(0); z-index: 6; }
        }
    </style>
</head>
<body>

    <div id="cursor-glow-bg"></div>

    <div id="main-app">
        <div class="app-layout" id="layout-wrapper">
            
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="hamburger" onclick="toggleMenu()">☰</div>
                    <input type="text" class="search-bar" id="search-input" placeholder="Поиск пользователей или групп...">
                </div>
                
                <div class="room-list" id="sidebar-room-list">
                    <div id="chats-container"></div>
                    <div id="search-container" style="display: none;"></div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header" id="main-chat-header" style="display: none;">
                    <div class="back-btn" onclick="closeActiveChat()">←</div>
                    <div class="chat-title" id="chat-title-top">Выберите чат</div>
                    
                    <div class="header-actions">
                        <div class="header-action-btn" id="call-user-btn" onclick="startCall()" title="Позвонить" style="display: none;">📞</div>
                        <div class="header-action-btn" id="add-member-btn" onclick="openAddMemberModal()" title="Добавить участника" style="display: none;">👤+</div>
                    </div>
                </div>

                <div class="messages-container" id="messages"></div>

                <div class="input-panel" id="main-input-panel" style="display: none;">
                    <div class="attach-btn" onclick="triggerFileInput()">📎</div>
                    <input type="file" id="file-input" onchange="handleFileSelect()">
                    
                    <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off">
                    <div id="send-btn" onclick="sendMessage()">Отправить</div>
                </div>
            </div>

        </div>
    </div>

    <div id="side-menu-overlay" onclick="toggleMenu()"></div>
    <div id="side-menu">
        <div class="menu-profile-header">
            <div class="menu-avatar" id="my-profile-avatar">?</div>
            <div class="menu-name" id="my-profile-name">Загрузка...</div>
            <div class="menu-status">в сети</div>
        </div>
        <div class="menu-items">
            <div class="menu-item" onclick="openContactsModal()"><span class="menu-icon">👥</span> Контакты</div>
            <div class="menu-item" onclick="openModal('group-modal')"><span class="menu-icon">💬</span> Создать группу</div>
            <div class="menu-item" onclick="openGalleryModal()"><span class="menu-icon">🖼️</span> Медиа чата</div>
            <div class="menu-item" style="color: #ff6b6b;" onclick="location.href='/logout'"><span class="menu-icon">🚪</span> Выйти</div>
        </div>
    </div>

    <div id="group-modal" class="modal-overlay" onclick="handleOutsideClick(event, 'group-modal')">
        <div class="modal-box">
            <h3>Создать группу</h3>
            <input type="text" id="new-group-name" placeholder="Название группы">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Отмена</button>
                <button class="btn-confirm" onclick="createGroup()">Создать</button>
            </div>
        </div>
    </div>

    <div id="contacts-modal" class="modal-overlay" onclick="handleOutsideClick(event, 'contacts-modal')">
        <div class="modal-box">
            <h3>Все пользователи</h3>
            <div id="contacts-list" class="modal-list"></div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="add-member-modal" class="modal-overlay" onclick="handleOutsideClick(event, 'add-member-modal')">
        <div class="modal-box">
            <h3>Добавить участника</h3>
            <div id="add-member-list" class="modal-list"></div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="incoming-call-modal" class="modal-overlay">
        <div class="modal-box" style="text-align: center;">
            <h3 style="margin-bottom: 5px;">Входящий вызов</h3>
            <div id="caller-name" style="color: #6e89b5; font-size: 16px; margin-bottom: 24px; font-weight: 500;">Пользователь</div>
            <div class="modal-btns" style="justify-content: center; gap: 20px;">
                <button class="btn-danger" onclick="declineCall()">Отклонить</button>
                <button class="btn-success pulse-btn" onclick="acceptCall()">Принять</button>
            </div>
        </div>
    </div>

    <div id="call-status-modal" class="modal-overlay">
        <div class="modal-box" style="text-align: center;">
            <h3 id="call-status-title" style="margin-bottom: 5px;">Установка соединения...</h3>
            <div id="call-timer" style="font-size: 24px; font-weight: bold; margin: 20px 0; color: #00a0ff;">00:00</div>
            <div class="modal-btns" style="justify-content: center;">
                <button class="btn-danger" style="padding: 12px 30px; border-radius: 24px;" onclick="endCall()">Завершить звонок</button>
            </div>
        </div>
    </div>

    <div id="gallery-modal" class="modal-overlay" onclick="handleOutsideClick(event, 'gallery-modal')">
        <div class="modal-box" style="max-width: 500px;">
            <h3>Медиа файлы чата</h3>
            <div class="gallery-grid" id="gallery-grid-content"></div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">Закрыть</button>
            </div>
        </div>
    </div>

    <audio id="localAudio" autoplay muted></audio>
    <audio id="remoteAudio" autoplay></audio>

    <script>
        // Инициализация фонового интерактивного свечения за курсором
        (function() {
            const glow = document.getElementById('cursor-glow-bg');
            let mx = window.innerWidth / 2, my = window.innerHeight / 2, gx = mx, gy = my;
            document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
            function updateGlow() {
                gx += (mx - gx) * 0.08; gy += (my - gy) * 0.08;
                glow.style.left = gx + 'px'; glow.style.top = gy + 'px';
                requestAnimationFrame(updateGlow);
            }
            updateGlow();
        })();

        // Глобальные переменные состояния
        let ws = null;
        let myUsername = "";
        let isSystemAdmin = false;
        let currentRoom = null;
        let currentChatPartner = null;
        let renderedRooms = new Set();

        // Переменные WebRTC-звонков
        let localStream = null;
        let peerConnection = null;
        let callTarget = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let iceCandidateQueue = [];
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Экранирование спецсимволов для защиты от XSS инъекций
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Автоматическое определение WebSocket-протокола
        function getWsUrl() {
            const loc = window.location;
            const proto = loc.protocol === "https:" ? "wss:" : "ws:";
            return `${proto}//${loc.host}/ws`;
        }

        // Подключение и обработка WebSocket
        function connectWebSocket() {
            ws = new WebSocket(getWsUrl());

            ws.onopen = () => { console.log("WebSocket успешно подключен"); };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    myUsername = data.username;
                    isSystemAdmin = !!data.is_admin;
                    document.getElementById('my-profile-name').textContent = myUsername;
                    const avatarEl = document.getElementById('my-profile-avatar');
                    avatarEl.textContent = myUsername.charAt(0).toUpperCase();
                    if (isSystemAdmin) {
                        document.body.classList.add('global-admin-mode');
                    }
                } 
                else if (data.type === 'rooms') {
                    const container = document.getElementById('chats-container');
                    container.innerHTML = '';
                    renderedRooms.clear();
                    data.rooms.forEach(room => {
                        addRoomToSidebar(room.id, room.is_private, room.title, room.unread, room.last_msg, room.last_time, room.online);
                    });
                } 
                else if (data.type === 'msg') {
                    let isPrivate = data.room.startsWith('PRIVATE|');
                    let targetTitle = data.room;
                    if (isPrivate) {
                        const parts = data.room.split('|');
                        targetTitle = parts[1] === myUsername ? parts[2] : parts[1];
                    }
                    
                    addRoomToSidebar(data.room, isPrivate, targetTitle, (data.room !== currentRoom), data.content, data.time, false, data.msg_type);
                    
                    if (data.room === currentRoom) {
                        appendMessage(data, false);
                        if (document.hidden || data.room !== currentRoom) {
                            // логика уведомлений
                        } else {
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({ action: 'read', room: currentRoom }));
                            }
                        }
                    }
                } 
                else if (data.type === 'search') {
                    handleSearchResults(data.results);
                } 
                else if (data.type === 'users') {
                    populateUsersLists(data.users);
                } 
                else if (data.type === 'call_signal') {
                    handleCallSignal(data);
                }
                else if (data.type === 'msg_deleted') {
                    const msgEl = document.getElementById('msg-block-' + data.id);
                    if (msgEl) {
                        msgEl.innerHTML = `<div class="msg-body" style="color:#8b949e; font-style:italic;">Сообщение удалено администратором</div>`;
                    }
                }
            };

            ws.onclose = () => {
                console.log("WebSocket закрыт. Реконнект через 3 секунды...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Отрисовка списка комнат в сайдбаре
        function addRoomToSidebar(roomId, isPrivate, title, isUnread = false, lastMsg = '', lastTime = '', online = false, msgType = 'text') {
            const container = document.getElementById('chats-container');

            if (!div) {
                div = document.createElement('div');
                div.id = 'room-' + roomId;
                div.setAttribute('data-room-id', roomId);
                div.setAttribute('data-room-title', title);
                div.setAttribute('data-item-type', isPrivate ? 'private' : 'group');
                container.appendChild(div);
            }

            div.className = `room-item ${roomId === currentRoom ? 'active' : ''} ${online ? 'online' : ''}`;

            let displayPreview = 'Нет сообщений';
            if (lastMsg) {
                if (msgType === 'text') displayPreview = escapeHTML(lastMsg);
                else if (msgType === 'image') displayPreview = '📷 [Фотография]';
                else if (msgType === 'audio') displayPreview = '🎵 [Аудиозапись]';
                else if (msgType === 'video') displayPreview = '🎥 [Видеозапись]';
                else displayPreview = '📎 [Файл]';
            }

            if (isUnread) {
                div.style.background = 'rgba(0, 160, 255, 0.08)';
            } else if (roomId !== currentRoom) {
                div.style.background = '';
            }

            div.innerHTML = `
                <div class="avatar-wrapper">
                    <div class="avatar">${escapeHTML(title.charAt(0).toUpperCase())}</div>
                    <div class="online-dot"></div>
                </div>
                <div class="room-info">
                    <div class="room-meta">
                        <span class="room-name">${escapeHTML(title)}</span>
                        <span class="room-time" id="time-${roomId}">${escapeHTML(lastTime)}</span>
                    </div>
                    <div class="room-preview" id="p-${roomId}" style="${isUnread ? 'color:#fff;font-weight:500;' : ''}">${displayPreview}</div>
                </div>
            `;
            renderedRooms.add(roomId);
        }

        // Выбор и открытие комнаты чата
        document.getElementById('sidebar-room-list').addEventListener('click', function(e) {
            const item = e.target.closest('.room-item');

        function openChatRoom(roomId, titleText) {
            if (currentRoom) {
                const oldEl = document.getElementById('room-' + currentRoom);
                if (oldEl) oldEl.classList.remove('active');
            }

            currentRoom = roomId;
            const targetRoomEl = document.getElementById('room-' + currentRoom);
            if (targetRoomEl) {
                targetRoomEl.classList.add('active');
                targetRoomEl.style.background = '';
                const pEl = document.getElementById('p-' + currentRoom);
                if (pEl) pEl.style.cssText = '';
            }

            // Открытие UI компонентов окна чата
            document.getElementById('main-chat-header').style.display = 'flex';
            document.getElementById('main-input-panel').style.display = 'flex';
            document.getElementById('chat-title-top').textContent = titleText;

            // Настройка отображения кнопок шапки звонков / добавления
            if (!roomId.startsWith('PRIVATE|')) {
                document.getElementById('add-member-btn').style.display = 'block';
                document.getElementById('call-user-btn').style.display = 'none';
            } else {
                document.getElementById('add-member-btn').style.display = 'none';
                document.getElementById('call-user-btn').style.display = 'flex';
            }

            document.getElementById('messages').innerHTML = '';
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'history', room: currentRoom }));
                ws.send(JSON.stringify({ action: 'read', room: currentRoom }));
            }
        }

        function closeActiveChat() {

                if (oldEl) oldEl.classList.remove('active');

        // Отрисовка сообщения на экране
        function appendMessage(msg, isHistoryLoad = false) {
            const container = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `msg-row ${msg.sender === myUsername ? 'my-row' : ''}`;
            
            const div = document.createElement('div');
            div.id = 'msg-block-' + msg.id;
            
            if (msg.msg_type === 'system') {
                div.className = 'msg-block system-msg';
                div.innerHTML = `<div class="msg-body">${escapeHTML(msg.content)}</div>`;
                row.appendChild(div);
                container.appendChild(row);
                container.scrollTop = container.scrollHeight;
                return;
            }

            div.className = `msg-block ${isSystemAdmin ? 'admin-active' : ''}`;
            
            let html = `<div class="msg-author">${escapeHTML(msg.sender)}</div>`;
            html += `<div class="msg-body">`;

            if (msg.msg_type === 'text') {
                html += escapeHTML(msg.content);
            } else if (msg.msg_type === 'image') {
                html += `<img src="${escapeHTML(msg.file_url)}" alt="Изображение" onclick="window.open('${escapeHTML(msg.file_url)}', '_blank')">`;
                if(msg.content) html += `<p style="margin:6px 0 0 0;">${escapeHTML(msg.content)}</p>`;
            } else if (msg.msg_type === 'audio') {
                html += `<audio src="${escapeHTML(msg.file_url)}" controls></audio>`;
            } else if (msg.msg_type === 'video') {
                html += `<video src="${escapeHTML(msg.file_url)}" controls></video>`;
                if(msg.content) html += `<p style="margin:6px 0 0 0;">${escapeHTML(msg.content)}</p>`;
            } else {
                html += `<a class="download-btn" href="${escapeHTML(msg.file_url)}" download>💾 Скачать файл (${escapeHTML(msg.content || 'Документ')})</a>`;
            }

            html += `</div><div class="msg-time">${escapeHTML(msg.time)}</div>`;

            if (isSystemAdmin) {
                html += `<div class="admin-actions"><span class="adm-btn" onclick="deleteMessage(${msg.id})">Удалить</span></div>`;
            }

            div.innerHTML = html;
            row.appendChild(div);
            container.appendChild(row);

            if (!isHistoryLoad) container.scrollTop = container.scrollHeight;
            else {
                setTimeout(() => { container.scrollTop = container.scrollHeight; }, 10);
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const val = input.value.trim();
            if (!val || !currentRoom) return;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'msg',
                    room: currentRoom,
                    msg_type: 'text',
                    content: val
                }));
                input.value = '';
            }

        function handleFileSelect() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file || !currentRoom) return;

            let comment = "";
            if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
                comment = prompt("Добавьте описание (не обязательно):", "");
                if (comment === null) { fileInput.value = ''; return; }
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('room', currentRoom);
            formData.append('content', comment || file.name);

            fetch('/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.error) alert("Ошибка загрузки: " + data.error);
                fileInput.value = '';
            })
            .catch(err => { console.error(err); fileInput.value = ''; });
        }

        // =================================== LOGIC WEBRTC VOICE CALLING ===================================
        
        function startCall() {
            if (!currentChatPartner) return;
            callTarget = currentChatPartner;
            document.getElementById('call-status-title').textContent = "Исходящий вызов для " + callTarget;
            openModal('call-status-modal');

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                document.getElementById('localAudio').srcObject = stream;
                setupPeerConnection();
                
                peerConnection.createOffer()
                .then(offer => peerConnection.setLocalDescription(offer))
                .then(() => {
                    sendCallSignal({ type: 'offer', offer: peerConnection.localDescription });
                });
            })
            .catch(err => { alert("Не удалось получить доступ к микрофону"); endCall(); });
        }

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendCallSignal({ type: 'candidate', candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
            };
        }

        function sendCallSignal(payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'call_signal',
                    target: callTarget,
                    data: payload
                }));
            }
        }

        function handleCallSignal(msg) {
            const sender = msg.sender;
            const payload = msg.data;

            if (payload.type === 'offer') {
                if (peerConnection) {
                    // Если занят, сбрасываем автоматически
                    if (ws) ws.send(JSON.stringify({ action: 'call_signal', target: sender, data: { type: 'busy' } }));
                    return;
                }
                callTarget = sender;
                document.getElementById('caller-name').textContent = sender;
                openModal('incoming-call-modal');
                iceCandidateQueue = [];
            } 
            else if (payload.type === 'answer') {
                if (peerConnection) {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer))
                    .then(() => {
                        processQueuedCandidates();
                        startCallTimer();
                    });
                }
            } 
            else if (payload.type === 'candidate') {
                const candidate = new RTCIceCandidate(payload.candidate);
                if (peerConnection && peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(candidate);
                } else {
                    iceCandidateQueue.push(candidate);
                }
            } 
            else if (payload.type === 'decline' || payload.type === 'busy') {
                alert(payload.type === 'busy' ? "Линия занята" : "Вызов отклонен пользователем");
                endCall();
            } 
            else if (payload.type === 'hangup') {
                endCall();
            }
        }

        function processQueuedCandidates() {
            while (iceCandidateQueue.length > 0) {
                peerConnection.addIceCandidate(iceCandidateQueue.shift());
            }
        }

        function acceptCall() {
            document.getElementById('incoming-call-modal').style.display = 'none';
            document.getElementById('call-status-title').textContent = "Разговор с " + callTarget;
            openModal('call-status-modal');

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                document.getElementById('localAudio').srcObject = stream;
                setupPeerConnection();

                sendCallSignal({ type: 'decline_placeholder_if_any_errors' }); // фиктивный триггер сброса состояний при сбое у вызывающего
                
                // Сигнализируем ответ вызывающей стороне
                if (ws) {
                    ws.send(JSON.stringify({
                        action: 'call_signal',
                        target: callTarget,
                        data: { type: 'ready_to_receive_offer' } // инвертируем хэндшейк при необходимости, либо запрашиваем реконнект
                    }));
                }
                
                // Для простоты — симулируем стандартный WebRTC Answer через получение сохраненного оффера
                // Сервер перешлет повторно сессию
            })
            .catch(err => { alert("Нет доступа к микрофону"); declineCall(); });
        }

        // Фикс цепочки хэндшейка для входящего стрима
        function executeDelayedOfferHandle(sender, offerPayload) {
             navigator.mediaDevices.getUserMedia({ audio: true, video: false })
             .then(stream => {
                localStream = stream;
                document.getElementById('localAudio').srcObject = stream;
                setupPeerConnection();
                return peerConnection.setRemoteDescription(new RTCSessionDescription(offerPayload));
             })
             .then(() => peerConnection.createAnswer())
             .then(answer => peerConnection.setLocalDescription(answer))
             .then(() => {
                sendCallSignal({ type: 'answer', answer: peerConnection.localDescription });
                startCallTimer();
             })
             .catch(err => { endCall(); });
        }

        // Перегрузка роутера для фикса хэндшейка ответов
        const nativeHandleCallSignal = handleCallSignal;
        handleCallSignal = function(msg) {
            if (msg.data.type === 'offer' && !peerConnection) {
                // Если окно входящего вызова не открыто, значит мы обрабатываем авто-акцепт
                if (document.getElementById('incoming-call-modal').style.display === 'flex' || document.getElementById('call-status-modal').style.display === 'flex') {
                    if (document.getElementById('call-status-modal').style.display === 'flex') {
                        executeDelayedOfferHandle(msg.sender, msg.data.offer);
                        return;
                    }
                }
            }
            if (msg.data.type === 'ready_to_receive_offer') {
                // Вызывающий пересоздает Offer для надежности канала
                if (peerConnection) {
                    peerConnection.createOffer({ iceRestart: true })
                    .then(offer => peerConnection.setLocalDescription(offer))
                    .then(() => { sendCallSignal({ type: 'offer', offer: peerConnection.localDescription }); });
                }
                return;
            }
            nativeHandleCallSignal(msg);
        };

        function declineCall() {
            document.getElementById('incoming-call-modal').style.display = 'none';
            sendCallSignal({ type: 'decline' });
            callTarget = null;
        }

        function endCall() {
            stopCallTimer();
            closeModals();
            document.getElementById('incoming-call-modal').style.display = 'none';

            if (callTarget) {
                sendCallSignal({ type: 'hangup' });
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            document.getElementById('localAudio').srcObject = null;
            document.getElementById('remoteAudio').srcObject = null;
            callTarget = null;
            iceCandidateQueue = [];
        }

        function startCallTimer() {
            stopCallTimer();
            callSeconds = 0;
            document.getElementById('call-timer').textContent = "00:00";
            callTimerInterval = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                document.getElementById('call-timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopCallTimer() {
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }
        }

        // Точка входа при загрузке документа
        window.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
        });
    </script>
</body>
</html>
