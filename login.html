<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SAM Messenger - Вход</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at center, #070b14 0%, #020408 100%);
            color: #dbe5ff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }

        /* 1. ФОНАРИК ДЛЯ ЗАДНЕГО ФОНА */
        #cursor-glow-bg {
            position: absolute;
            width: 250px; 
            height: 250px;
            background: radial-gradient(circle, rgba(0, 160, 255, 0.3) 0%, transparent 60%);
            filter: blur(15px);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: opacity 0.4s ease;
        }

        /* 2. ГЛАВНАЯ ПАНЕЛЬ */
        #auth-block {
            position: relative;
            background: rgba(10, 16, 26, 0.7);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(163, 191, 255, 0.05);
            border-radius: 24px; 
            padding: 40px 36px; 
            width: 390px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.95);
            text-align: center; 
            transform-style: preserve-3d;
            z-index: 1;
            text-shadow: 0 0 8px rgba(163, 191, 255, 0.25);
            overflow: hidden;
        }

        /* ФОНАРИК ВНУТРИ ПАНЕЛИ */
        #panel-inner-glow {
            position: absolute;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #auth-block h2 { 
            position: relative; z-index: 2; 
            margin: 0 0 30px 0; 
            font-size: 28px;
            font-weight: 700; 
            background: linear-gradient(135deg, #ffffff 0%, #a3cfff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        /* 3. СТЕКЛЯННЫЕ ЭЛЕМЕНТЫ */
        .glass-element {
            position: relative;
            width: 100%; margin: 14px 0;
            background: rgba(12, 18, 30, 0.35); 
            border-radius: 14px; 
            transform: translate(var(--translate-x, 0px), var(--translate-y, 0px)) scale(1);
            transition: background 0.3s, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1), box-shadow 0.3s;
            z-index: 2;
        }

        .glass-glow {
            position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 1;
        }
        .glass-glow::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(130px circle at var(--local-x, 50%) var(--local-y, 50%), rgba(0, 200, 255, 0.2), transparent 100%);
            opacity: 0; transition: opacity 0.3s ease;
        }

        .glass-element::after {
            content: ''; position: absolute; inset: -1px;
            border-radius: inherit; padding: 2px;
            background: radial-gradient(100px circle at var(--local-x, 50%) var(--local-y, 50%), rgba(0, 180, 255, 0.7) 0%, rgba(0, 100, 255, 0.3) 50%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 5; opacity: 0; 
            transition: opacity 0.3s ease;
        }

        .glass-element:hover { background: rgba(8, 12, 22, 0.45); }
        .glass-element:hover .glass-glow::before, .glass-element:hover::after { opacity: 1; }

        .glass-element:active {
            transform: translate(var(--translate-x, 0px), var(--translate-y, 0px)) scale(0.96) translateY(3px) !important;
            background: rgba(4, 6, 10, 0.98) !important; 
        }
        .glass-element:active .glass-glow::before { opacity: 0 !important; }
        .glass-element:active::after { opacity: 0.2 !important; }

        /* 4. ВКЛАДКИ И КАПСУЛА */
        .tabs-glass {
            background: rgba(12, 18, 28, 0.6); 
            padding: 5px; 
            margin-bottom: 25px;
            display: flex; align-items: center;
        }
        .auth-tabs { display: flex; width: 100%; position: relative; z-index: 2; }
        
        .tab { 
            flex: 1; padding: 12px 0; cursor: pointer; color: #5c7499; 
            font-weight: 600; font-size: 14px; text-align: center;
            position: relative; z-index: 3; transition: color 0.3s ease;
        }
        .tab.active { color: #dbe5ff; text-shadow: 0 0 12px rgba(0, 180, 255, 0.5); }

        .tab-slider {
            position: absolute; 
            top: 5px; bottom: 5px; 
            left: 5px; width: calc(50% - 5px); 
            background: rgba(0, 150, 255, 0.2);
            border: 1px solid rgba(0, 180, 255, 0.35);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 180, 255, 0.3), inset 0 0 10px rgba(0, 180, 255, 0.2);
            z-index: 1; pointer-events: none;
        }

        /* 5. ПОЛЯ ВВОДА */
        .auth-input { 
            width: 100%; padding: 16px; 
            background: transparent; border: none; 
            color: #dbe5ff; outline: none; 
            position: relative; z-index: 4; font-size: 15px;
        }
        .auth-input::placeholder { color: #435368; text-shadow: none; }

        /* Контейнер плавного скрытия/появления никнейма при регистрации */
        #reg-user-wrap {
            max-height: 0; opacity: 0; overflow: hidden; margin: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;
        }
        #reg-user-wrap.expanded { max-height: 100px; opacity: 1; }

        .auth-btn {
            padding: 16px; margin-top: 15px;
            background: rgba(0, 140, 255, 0.15);
            font-weight: 600; cursor: pointer; color: #dbe5ff; font-size: 16px;
            display: flex; justify-content: center; align-items: center; border: none;
        }
        .auth-btn span { position: relative; z-index: 4; }

        #auth-error { position: relative; z-index: 2; color: #ff5757; font-size: 14px; margin-top: 15px; min-height: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="cursor-glow-bg"></div>

    <div id="auth-block">
        <div id="panel-inner-glow"></div>

        <h2>SAM Messenger</h2>
        
        <div class="glass-element tabs-glass">
            <div class="glass-glow"></div>
            <div class="tab-slider" id="tab-slider"></div>
            <div class="auth-tabs">
                <div id="tab-login" class="tab active" onclick="switchAuthTab('login')">Вход</div>
                <div id="tab-reg" class="tab" onclick="switchAuthTab('register')">Регистрация</div>
            </div>
        </div>

        <!-- Поле никнейма (показывается только при Регистрации) -->
        <div id="reg-user-wrap">
            <div class="glass-element">
                <div class="glass-glow"></div>
                <input type="text" id="auth-user" class="auth-input" placeholder="Имя пользователя" autocomplete="off">
            </div>
        </div>

        <!-- Поле Почты с интерактивной кнопкой запроса кода -->
        <div class="glass-element" style="display: flex; align-items: center;">
            <div class="glass-glow"></div>
            <input type="email" id="auth-email" class="auth-input" placeholder="Электронная почта" autocomplete="off" style="flex: 1;">
            <button id="send-code-btn" onclick="requestCode(event)" style="position: relative; z-index: 6; background: none; border: none; color: #00aaff; cursor: pointer; padding: 0 20px; font-weight: bold; font-size: 14px; white-space: nowrap; height: 100%;">
                Код
            </button>
        </div>

        <!-- Поле Одноразового Кода -->
        <div class="glass-element">
            <div class="glass-glow"></div>
            <input type="text" id="auth-code" class="auth-input" placeholder="Код подтверждения" autocomplete="off">
        </div>

        <button class="auth-btn glass-element" onclick="submitAuth()">
            <div class="glass-glow"></div>
            <span id="btn-text">Войти в систему</span>
        </button>
        
        <div id="auth-error"></div>
    </div>

    <script>
        // --- ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ЧЕРЕЗ WEBSOCKET ---
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(wsProtocol + '//' + window.location.host + '/ws');
        let currentAuthAction = 'login';

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const errorEl = document.getElementById('auth-error');

            if (data.type === 'auth_result') {
                if (data.success) {
                    localStorage.setItem('sam_username', data.username);
                    window.location.href = '/chat';
                } else {
                    errorEl.style.color = '#ff5757';
                    errorEl.textContent = data.error;
                }
            } 
            // Обработка успешной генерации и отправки кода
            else if (data.type === 'code_sent') {
                errorEl.style.color = '#57ff57'; // Зеленый цвет для информирования
                errorEl.textContent = data.text;
                resetCodeButtonCooldown();
            }
            // Ошибки бэкенда при генерации
            else if (data.type === 'auth_error') {
                errorEl.style.color = '#ff5757';
                errorEl.textContent = data.text;
            }
        };

        // --- ЗАПРОС КОДА НА ПОЧТУ ЧЕРЕЗ WS ---
        function requestCode(event) {
            if (event) event.stopPropagation(); // Исключаем срабатывание клика по контейнеру glass-element
            
            const email = document.getElementById('auth-email').value.trim();
            const errorEl = document.getElementById('auth-error');

            if (!email) {
                errorEl.style.color = '#ff5757';
                errorEl.textContent = 'Сначала введите адрес электронной почты!';
                return;
            }

            if (ws.readyState === WebSocket.OPEN) {
                errorEl.style.color = '#a3cfff';
                errorEl.textContent = 'Отправка запроса...';
                ws.send(JSON.stringify({ action: 'request_code', email: email }));
            } else {
                errorEl.style.color = '#ff5757';
                errorEl.textContent = 'Нет соединения с сервером.';
            }
        }

        // Таймер защиты от спама на кнопке
        function resetCodeButtonCooldown() {
            const btn = document.getElementById('send-code-btn');
            btn.disabled = true;
            let timeLeft = 30;
            
            const timer = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.innerText = "Код";
                    btn.disabled = false;
                    btn.style.color = "#00aaff";
                } else {
                    btn.style.color = "#435368";
                    btn.innerText = `${timeLeft}с`;
                    timeLeft--;
                }
            }, 1000);
        }

        // --- ОТПРАВКА ФОРМЫ (ВХОД ИЛИ РЕГИСТРАЦИЯ) ---
        function submitAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const code = document.getElementById('auth-code').value.trim();
            const errorEl = document.getElementById('auth-error');

            if (!email || !code) {
                errorEl.style.color = '#ff5757';
                errorEl.textContent = 'Заполните поля электронной почты и кода!';
                return;
            }

            const payload = {
                action: currentAuthAction,
                email: email,
                code: code
            };

            if (currentAuthAction === 'register') {
                const username = document.getElementById('auth-user').value.trim();
                if (!username) {
                    errorEl.style.color = '#ff5757';
                    errorEl.textContent = 'Укажите имя пользователя для регистрации!';
                    return;
                }
                payload.username = username;
            }

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            } else {
                errorEl.style.color = '#ff5757';
                errorEl.textContent = 'Нет соединения с сервером. Обновите страницу.';
            }
        }

        // --- АНИМАЦИЯ КАПСУЛЫ И СМЕНА ПОЛЕЙ ПРИ ПЕРЕКЛЮЧЕНИИ ВКЛАДОК ---
        function switchAuthTab(type) {
            if (currentAuthAction === type) return;
            currentAuthAction = type;
            
            const slider = document.getElementById('tab-slider');
            const isReg = type === 'register';

            slider.style.transition = 'left 0.15s ease-in, width 0.15s ease-in';
            slider.style.left = '5px';
            slider.style.width = 'calc(100% - 10px)';

            document.getElementById('tab-login').classList.toggle('active', !isReg);
            document.getElementById('tab-reg').classList.toggle('active', isReg);

            const regWrap = document.getElementById('reg-user-wrap');
            if (isReg) regWrap.classList.add('expanded');
            else regWrap.classList.remove('expanded');

            document.getElementById('btn-text').textContent = isReg ? 'Создать аккаунт' : 'Войти в систему';
            document.getElementById('auth-error').textContent = '';

            setTimeout(() => {
                slider.style.transition = 'left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
                slider.style.left = isReg ? '50%' : '5px';
                slider.style.width = 'calc(50% - 5px)';
            }, 150);
        }

        // --- ЭФФЕКТЫ СВЕЧЕНИЯ И 3D КУРСОР ---
        const authBlock = document.getElementById('auth-block');
        const bgGlow = document.getElementById('cursor-glow-bg');
        const innerGlow = document.getElementById('panel-inner-glow');
        const glassElements = document.querySelectorAll('.glass-element');
        
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let glowX = mouseX, glowY = mouseY;
        let blockCurrentX = 0, blockCurrentY = 0;
        let blockTargetX = 0, blockTargetY = 0;
        let isOverMainPanel = false;

        authBlock.addEventListener('mouseenter', () => {
            isOverMainPanel = true;
            bgGlow.style.opacity = '0';
            innerGlow.style.opacity = '1';
        });
        authBlock.addEventListener('mouseleave', () => {
            isOverMainPanel = false;
            bgGlow.style.opacity = '1';
            innerGlow.style.opacity = '0';
        });

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            if (isOverMainPanel) {
                blockTargetX = 0; blockTargetY = 0;
            } else {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                blockTargetX = ((centerY - mouseY) / centerY) * 12;
                blockTargetY = ((mouseX - centerX) / centerX) * 12;
            }
        });

        let elementsData = Array.from(glassElements).map(el => ({ el: el, tX: 0, tY: 0, cX: 0, cY: 0 }));

        glassElements.forEach((el, index) => {
            el.addEventListener('mouseleave', () => {
                elementsData[index].tX = 0; elementsData[index].tY = 0;
            });
            el.addEventListener('mousemove', (e) => {
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                
                el.style.setProperty('--local-x', `${x}px`);
                el.style.setProperty('--local-y', `${y}px`);

                const dx = x - rect.width / 2; const dy = y - rect.height / 2;
                elementsData[index].tX = (dx / (rect.width / 2)) * 4;
                elementsData[index].tY = (dy / (rect.height / 2)) * 4;
            });
        });

        function renderLoop() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            
            bgGlow.style.left = `${glowX}px`; bgGlow.style.top = `${glowY}px`;
            
            if (isOverMainPanel) {
                const rect = authBlock.getBoundingClientRect();
                innerGlow.style.left = `${glowX - rect.left}px`;
                innerGlow.style.top = `${glowY - rect.top}px`;
            }

            blockCurrentX += (blockTargetX - blockCurrentX) * 0.08;
            blockCurrentY += (blockTargetY - blockCurrentY) * 0.08;
            authBlock.style.transform = `rotateX(${blockCurrentX}deg) rotateY(${blockCurrentY}deg)`;

            elementsData.forEach(data => {
                data.cX += (data.tX - data.cX) * 0.1;
                data.cY += (data.tY - data.cY) * 0.1;
                data.el.style.setProperty('--translate-x', `${data.cX}px`);
                data.el.style.setProperty('--translate-y', `${data.cY}px`);
            });

            requestAnimationFrame(renderLoop);
        }
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
