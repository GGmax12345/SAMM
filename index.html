<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sam Messenger</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .chat-box { height: 350px; border: 1px solid #e0e0e0; padding: 15px; overflow-y: auto; margin-bottom: 15px; background: #fdfdfd; border-radius: 6px; }
        .message { margin-bottom: 12px; padding: 8px 12px; background: #f1f0f0; border-radius: 8px; width: fit-content; max-width: 85%; }
        .message .author { font-weight: bold; color: #007bff; margin-right: 5px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tabs span { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #666; font-weight: 500; }
        .tabs span.active { color: #007bff; border-bottom: 2px solid #007bff; font-weight: bold; }
        .header-chat { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { width: auto; padding: 6px 12px; background: #dc3545; font-size: 12px; }
        .logout-btn:hover { background: #bd2130; }
    </style>
</head>
<body>

<div class="container">
    <!-- ОКНО ВХОДА И РЕГИСТРАЦИИ -->
    <div id="auth-block">
        <div class="tabs">
            <span id="tab-login" class="active" onclick="switchTab('login')">Вход</span>
            <span id="tab-register" onclick="switchTab('register')">Регистрация</span>
        </div>

        <div class="form-group">
            <input type="text" id="username" placeholder="Имя пользователя" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Пароль" required>
        </div>
        
        <button id="auth-btn" onclick="submitAuth()">Войти</button>
    </div>

    <!-- ОКНО С ТВОИМ ЧАТОМ -->
    <div id="chat-block" class="hidden">
        <div class="header-chat">
            <h3>Вы вошли как: <span id="chat-user" style="color:#007bff;"></span></h3>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <div id="chat-messages" class="chat-box"></div>
        
        <form id="chat-form" onsubmit="sendMessage(event)">
            <div style="display: flex;">
                <input type="text" id="message-input" placeholder="Напишите сообщение..." style="flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px 0 0 6px;" required>
                <button type="submit" style="width: auto; border-radius: 0 6px 6px 0; padding: 0 20px;">Отправить</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentMode = 'login'; 
    let socket = null;

    // Проверяем авторизацию при открытии страницы
    window.onload = function() {
        checkAuth();
    };

    function checkAuth() {
        const username = localStorage.getItem('sam_username');
        const token = localStorage.getItem('sam_token');

        if (username && token) {
            document.getElementById('auth-block').classList.add('hidden');
            document.getElementById('chat-block').classList.remove('hidden');
            document.getElementById('chat-user').innerText = username;
            initWebSocket(token);
        } else {
            document.getElementById('auth-block').classList.remove('hidden');
            document.getElementById('chat-block').classList.add('hidden');
            if (socket) { socket.close(); }
        }
    }

    function switchTab(mode) {
        currentMode = mode;
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
        document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        document.getElementById('auth-btn').innerText = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
    }

    async function submitAuth() {
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        if (!usernameInput || !passwordInput) {
            alert('Заполните все поля!');
            return;
        }

        // Если режим 'register' — запрос пойдет на /register, если 'login' — на /login
        const url = currentMode === 'login' ? '/login' : '/register';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                localStorage.setItem('sam_username', data.username);
                localStorage.setItem('sam_token', data.token);
                if (currentMode === 'register') alert('Регистрация успешна!');
                checkAuth();
            } else {
                alert('Ошибка: ' + (data.error || 'Не удалось выполнить действие'));
            }
        } catch (err) {
            alert('Не удалось подключиться к серверу.');
        }
    }

    function initWebSocket(token) {
        // Подключаемся к вебсокет-серверу
        socket = new WebSocket(`ws://${location.host}/ws?token=${token}`);

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span class="author">${data.username}:</span><span>${data.text}</span>`;
            
            const msgContainer = document.getElementById('chat-messages');
            msgContainer.appendChild(msgDiv);
            msgContainer.scrollTop = msgContainer.scrollHeight; 
        };

        socket.onclose = function(event) {
            if (event.code === 4001) {
                alert('Ошибка авторизации. Войдите заново.');
                logout();
            }
        };
    }

    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        
        if (text && socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ text: text }));
            input.value = '';
        }
    }

    function logout() {
        localStorage.removeItem('sam_username');
        localStorage.removeItem('sam_token');
        checkAuth();
    }
</script>
</body>
</html>
